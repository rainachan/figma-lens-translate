<!doctype html><html lang="en"><meta charset="utf-8"><title>Lens — isolated UI test</title><style>body{margin:0;background:#edf0ed;font:13px system-ui;color:#283d35}header{padding:18px 26px;background:white;border-bottom:1px solid #d4ddd7;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header strong{margin-right:auto}button{font:inherit;border:1px solid #bbc9c1;border-radius:6px;background:white;padding:8px 12px;cursor:pointer}main{display:flex;justify-content:center;padding:24px}iframe{width:400px;height:660px;border:1px solid #d1d9d4;box-shadow:0 16px 55px #233c3220;border-radius:12px;background:white}.note{font-size:11px;color:#576960}#result{margin:0 26px;font-size:12px}</style>
<header><strong>Lens · UI test</strong><span class="note">Synthetic design · Simulated translator</span><button id="first">Offline state</button><button id="second">Notification state</button><button id="empty">Clear selection</button><button id="rapid">Rapid selection test</button><button id="slow" class="scenario">Slow translation</button><button id="failure" class="scenario">Service error</button><button id="save-failure" class="scenario">Save error</button></header><main><iframe id="plugin" src="/ui.html" title="Lens plugin"></iframe></main><p id="result">Test harness ready.</p>
<script>
const frame=document.getElementById('plugin');let version=0,selected='first',pinned=false,scenario='',saveFailure=false;
const all={first:[['设备离线',40,94,210,30],['检查设备电源和网络连接，然后重试。',40,150,320,64],['重新连接',40,290,320,38]],second:[['通知设置',40,94,280,30],['关闭推送后，事件仍会保存在历史记录中。',40,150,320,64]]};
function send(m){frame.contentWindow.postMessage({pluginMessage:m},location.origin)}
function selection(){const values=all[selected]||[];send({type:'selection',version:++version,title:selected==='first'?'Device / Offline state':'Notifications / Settings',rootIds:values.length?['root']:[],canPreview:values.length>0,limited:false,context:{page:'Sample design',regions:['Test fixture']},items:values.map(([text,x,y,width,height],i)=>({id:selected+':'+i,text,group:'Example interaction notes',bounds:{x,y,width,height}}))})}
document.querySelectorAll('header button:not(.scenario)').forEach(b=>b.onclick=()=>{if(pinned)return;if(b.id==='rapid'){selected='first';selection();selected='second';selection()}else{selected=b.id;selection()}});
function settings(){send({type:'settings',editor:'figma',settings:{provider:'custom',profiles:{custom:{endpoint:location.origin+(scenario?'/'+scenario:'')+'/v1',protocol:'anthropic',auth:'none',key:'',model:'fixture-translator'}}}})}
document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{saveFailure=b.id==='save-failure';scenario=saveFailure?'':b.id;settings();selection();document.getElementById('result').textContent=saveFailure?'Simulated save failure enabled. Open Settings and Save & use.':'Simulated '+scenario+' response.'});
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow)return;const m=event.data.pluginMessage;if(!m)return;
if(m.type==='ready'){settings();selection()}
if(m.type==='pin'){pinned=m.pinned;send({type:'pin',pinned})}
if(m.type==='refresh')selection();
if(m.type==='save-settings'){document.getElementById('result').textContent='Settings received. The harness does not persist credentials.';send(saveFailure?{type:'host-error',action:'save-settings',requestId:m.requestId,message:'Figma could not save your settings. Retry saving before switching files.'}:{type:'settings-saved',requestId:m.requestId})}
if(m.type==='layout'){frame.style.width=m.mode==='compact'?'320px':m.mode==='mirror'?'760px':'400px';frame.style.height=m.mode==='compact'?'420px':'660px'}
if(m.type==='preview'){const c=document.createElement('canvas');c.width=400;c.height=380;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,400,380);ctx.fillStyle='#eef3f0';ctx.fillRect(0,0,400,56);ctx.fillStyle='#224435';ctx.font='16px system-ui';ctx.fillText('Device settings',28,34);for(const [text,x,y] of all[selected]||[]){ctx.font='16px system-ui';if(text.length>19){ctx.fillText(text.slice(0,18),x,y+20);ctx.fillText(text.slice(18),x,y+44)}else ctx.fillText(text,x,y+20)}c.toBlob(async blob=>send({type:'preview',version:m.version,bounds:{x:0,y:0,width:400,height:380},bytes:Array.from(new Uint8Array(await blob.arrayBuffer()))}))}
});
</script></html>
